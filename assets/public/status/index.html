<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Status</title>
        <link rel="icon" href="/static/logo.png" />
        <style>
            :root {
                color-scheme: dark;
                --bg: #111214;
                --panel: #1a1b1e;
                --border: #2e3035;
                --text: #e8e9ec;
                --muted: #9a9ca3;
                --ok: #30a46c;
                --warn: #f5a524;
                --orange: #f76b15;
                --danger: #e5484d;
                --info: #3e9bff;
                font-family:
                    "gg sans",
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
            }
            @media (prefers-color-scheme: light) {
                :root {
                    color-scheme: light;
                    --bg: #f4f5f7;
                    --panel: #ffffff;
                    --border: #dfe1e6;
                    --text: #17181b;
                    --muted: #5e616b;
                }
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                line-height: 1.5;
                font-size: 15px;
            }
            [hidden] {
                display: none !important;
            }
            main {
                max-width: 820px;
                margin: 0 auto;
                padding: 40px 16px 64px;
                display: flex;
                flex-direction: column;
                gap: 28px;
            }
            header {
                display: flex;
                align-items: center;
                gap: 12px;
            }
            header img {
                width: 40px;
                height: 40px;
                border-radius: 10px;
                object-fit: contain;
            }
            header h1 {
                margin: 0;
                font-size: 22px;
            }
            header a {
                margin-left: auto;
                color: var(--muted);
                font-size: 14px;
            }
            h2 {
                font-size: 13px;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--muted);
                margin: 0 0 10px;
            }
            .banner {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 18px 20px;
                border-radius: 12px;
                font-size: 18px;
                font-weight: 700;
                color: #fff;
                background: var(--ok);
            }
            .banner.minor {
                background: var(--warn);
                color: #1b1300;
            }
            .banner.major {
                background: var(--orange);
            }
            .banner.critical {
                background: var(--danger);
            }
            .banner.maintenance {
                background: var(--info);
            }
            .box {
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 12px;
                overflow: hidden;
            }
            .component {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 14px 18px;
                border-bottom: 1px solid var(--border);
            }
            .component:last-child {
                border-bottom: none;
            }
            .component .name {
                flex: 1;
                min-width: 0;
            }
            .component .desc {
                color: var(--muted);
                font-size: 13px;
            }
            .state {
                font-size: 13px;
                font-weight: 600;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                white-space: nowrap;
            }
            .state::before {
                content: "";
                width: 9px;
                height: 9px;
                border-radius: 50%;
                background: currentColor;
            }
            .s-operational {
                color: var(--ok);
            }
            .s-degraded_performance {
                color: var(--warn);
            }
            .s-partial_outage {
                color: var(--orange);
            }
            .s-major_outage {
                color: var(--danger);
            }
            .s-under_maintenance {
                color: var(--info);
            }
            .incident {
                padding: 16px 18px;
                border-bottom: 1px solid var(--border);
            }
            .incident:last-child {
                border-bottom: none;
            }
            .incident h3 {
                margin: 0 0 4px;
                font-size: 16px;
            }
            .i-minor h3 {
                color: var(--warn);
            }
            .i-major h3 {
                color: var(--orange);
            }
            .i-critical h3 {
                color: var(--danger);
            }
            .i-maintenance h3 {
                color: var(--info);
            }
            .meta {
                color: var(--muted);
                font-size: 13px;
            }
            .update {
                margin-top: 10px;
            }
            .update p {
                margin: 2px 0 0;
                white-space: pre-wrap;
            }
            .update strong {
                font-size: 14px;
            }
            .empty {
                padding: 18px;
                color: var(--muted);
            }
            footer {
                color: var(--muted);
                font-size: 13px;
                text-align: center;
            }
            .error {
                color: var(--danger);
            }
        </style>
    </head>
    <body>
        <main>
            <header>
                <img id="icon" src="/static/logo.png" alt="" />
                <h1 id="title">Status</h1>
                <a id="home" href="/" hidden>Home ↗</a>
            </header>
            <div id="banner" class="banner"><span>Loading status…</span></div>
            <section id="active-section" hidden>
                <h2>Active incidents</h2>
                <div class="box" id="active"></div>
            </section>
            <section id="maintenance-section" hidden>
                <h2>Maintenance</h2>
                <div class="box" id="maintenance"></div>
            </section>
            <section id="components-section" hidden>
                <h2>Components</h2>
                <div class="box" id="components"></div>
            </section>
            <section>
                <h2>Past incidents (14 days)</h2>
                <div class="box" id="history"></div>
            </section>
            <footer id="updated"></footer>
        </main>
        <script>
            "use strict";
            const STATE_LABELS = {
                operational: "Operational",
                degraded_performance: "Degraded performance",
                partial_outage: "Partial outage",
                major_outage: "Major outage",
                under_maintenance: "Under maintenance",
                investigating: "Investigating",
                identified: "Identified",
                monitoring: "Monitoring",
                resolved: "Resolved",
                scheduled: "Scheduled",
                in_progress: "In progress",
                verifying: "Verifying",
                completed: "Completed",
            };

            const el = (tag, attrs = {}, ...children) => {
                const node = document.createElement(tag);
                for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
                for (const child of children.flat()) if (child != null && child !== false) node.append(child instanceof Node ? child : String(child));
                return node;
            };
            const fmt = (d) => (d ? new Date(d).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "");

            function incident(i) {
                const meta = [];
                if (i.scheduled_for) meta.push(`Scheduled ${fmt(i.scheduled_for)} – ${fmt(i.scheduled_until)}`);
                if (i.components.length) meta.push(`Affects ${i.components.map((c) => c.name).join(", ")}`);
                return el(
                    "article",
                    { class: `incident i-${i.impact}` },
                    el("h3", {}, i.name),
                    meta.length ? el("div", { class: "meta" }, meta.join(" · ")) : null,
                    i.incident_updates.map((u) => el("div", { class: "update" }, el("strong", {}, STATE_LABELS[u.status] ?? u.status), " ", el("span", { class: "meta" }, fmt(u.created_at)), el("p", {}, u.body))),
                );
            }

            function fill(id, items, render, emptyText) {
                const box = document.getElementById(id);
                box.replaceChildren(...(items.length ? items.map(render) : [el("div", { class: "empty" }, emptyText)]));
            }

            async function load() {
                try {
                    const res = await fetch("/api/v9/status/summary.json", { cache: "no-store" });
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const s = await res.json();

                    document.title = `${s.page.name} Status`;
                    document.getElementById("title").textContent = `${s.page.name} Status`;
                    const home = document.getElementById("home");
                    if (s.page.url && /^https?:\/\//.test(s.page.url)) {
                        home.href = s.page.url;
                        home.hidden = false;
                    }

                    const banner = document.getElementById("banner");
                    banner.className = `banner ${s.status.indicator}`;
                    banner.replaceChildren(el("span", {}, s.status.description));

                    document.getElementById("active-section").hidden = !s.incidents.length;
                    fill("active", s.incidents, incident, "");
                    document.getElementById("maintenance-section").hidden = !s.scheduled_maintenances.length;
                    fill("maintenance", s.scheduled_maintenances, incident, "");
                    document.getElementById("components-section").hidden = !s.components.length;
                    fill(
                        "components",
                        s.components,
                        (c) =>
                            el(
                                "div",
                                { class: "component" },
                                el("div", { class: "name" }, el("div", {}, c.name), c.description ? el("div", { class: "desc" }, c.description) : null),
                                el("span", { class: `state s-${c.status}` }, STATE_LABELS[c.status] ?? c.status),
                            ),
                        "",
                    );
                    fill("history", s.history, incident, "No incidents in the last 14 days.");
                    document.getElementById("updated").textContent = `Last checked ${fmt(new Date())}`;
                } catch (e) {
                    document.getElementById("updated").replaceChildren(el("span", { class: "error" }, `Couldn't load the current status (${e.message}). Retrying…`));
                }
            }

            load();
            setInterval(load, 60000);
        </script>
    </body>
</html>
