<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>__INSTANCE_NAME__ Status</title>
        <link rel="icon" href="/static/logo.png" />
        <style>
            @font-face {
                font-family: "gg sans";
                font-style: normal;
                font-weight: 400;
                font-display: swap;
                src: url(/assets/66d715454104d24e.woff2) format("woff2");
            }
            @font-face {
                font-family: "gg sans";
                font-style: normal;
                font-weight: 500;
                font-display: swap;
                src: url(/assets/b272b33815319bae.woff2) format("woff2");
            }
            @font-face {
                font-family: "gg sans";
                font-style: normal;
                font-weight: 600;
                font-display: swap;
                src: url(/assets/2df2c3ff74408972.woff2) format("woff2");
            }
            @font-face {
                font-family: "gg sans";
                font-style: normal;
                font-weight: 700;
                font-display: swap;
                src: url(/assets/189422196a4f8b53.woff2) format("woff2");
            }
            @font-face {
                font-family: "gg sans";
                font-style: normal;
                font-weight: 800;
                font-display: swap;
                src: url(/assets/b2fdbe507d6ce9ef.woff2) format("woff2");
            }
            :root {
                color-scheme: dark;
                --bg: #121214;
                --panel: #1a1a1e;
                --border: #2b2b31;
                --text: #dfe0e2;
                --muted: #94959c;
                --empty-bar: #3a3a41;
                --brand: #5865f2;
                --ok: #23a55a;
                --warn: #f0b232;
                --orange: #f57731;
                --danger: #f23f43;
                --info: #5865f2;
                font-family:
                    "gg sans",
                    "Noto Sans",
                    "Helvetica Neue",
                    Helvetica,
                    Arial,
                    sans-serif;
            }
            @media (prefers-color-scheme: light) {
                :root {
                    color-scheme: light;
                    --bg: #f3f3f5;
                    --panel: #ffffff;
                    --border: #e1e2e5;
                    --text: #2f3035;
                    --muted: #5c5d64;
                    --empty-bar: #d4d5da;
                }
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                line-height: 1.5;
                font-size: 15px;
                -webkit-font-smoothing: antialiased;
            }
            [hidden] {
                display: none !important;
            }
            main {
                max-width: 860px;
                margin: 0 auto;
                padding: 40px 16px 64px;
                display: flex;
                flex-direction: column;
                gap: 32px;
            }
            header {
                display: flex;
                align-items: center;
                gap: 14px;
            }
            .brand-icon {
                width: 48px;
                height: 48px;
                flex: none;
                border-radius: 16px;
                object-fit: cover;
            }
            header h1 {
                margin: 0;
                font-size: 24px;
                font-weight: 800;
                min-width: 0;
                overflow-wrap: anywhere;
            }
            header a {
                margin-left: auto;
                flex: none;
                padding: 8px 16px;
                border-radius: 8px;
                background: var(--brand);
                color: #fff;
                font-size: 14px;
                font-weight: 500;
                text-decoration: none;
                transition: background-color 0.15s ease;
            }
            header a:hover {
                background: #4752c4;
            }
            h2 {
                font-size: 18px;
                font-weight: 700;
                margin: 0 0 12px;
            }
            .banner {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 18px 20px;
                border-radius: 8px;
                font-size: 18px;
                font-weight: 600;
                color: #fff;
                background: var(--ok);
                transition: background-color 0.2s ease;
            }
            .banner.loading {
                background: var(--panel);
                color: var(--muted);
                border: 1px solid var(--border);
            }
            .banner.minor {
                background: var(--warn);
                color: #1b1300;
            }
            .banner.major {
                background: var(--orange);
            }
            .banner.critical,
            .banner.unreachable {
                background: var(--danger);
            }
            .banner.maintenance {
                background: var(--info);
            }
            .box {
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 8px;
                overflow: hidden;
            }
            .caption {
                display: flex;
                justify-content: space-between;
                color: var(--muted);
                font-size: 13px;
                margin: 0 0 8px;
            }
            .component {
                padding: 16px 20px;
                border-bottom: 1px solid var(--border);
            }
            .component:last-child {
                border-bottom: none;
            }
            .component-head {
                display: flex;
                align-items: baseline;
                gap: 12px;
            }
            .component .name {
                flex: 1;
                min-width: 0;
                font-weight: 600;
            }
            .component .desc {
                color: var(--muted);
                font-size: 13px;
                font-weight: 400;
            }
            .state {
                font-size: 14px;
                font-weight: 500;
                white-space: nowrap;
            }
            .s-operational {
                color: var(--ok);
            }
            .s-degraded_performance {
                color: var(--warn);
            }
            .s-partial_outage {
                color: var(--orange);
            }
            .s-major_outage {
                color: var(--danger);
            }
            .s-under_maintenance {
                color: var(--info);
            }
            .bars {
                display: flex;
                gap: 2px;
                height: 34px;
                margin-top: 10px;
            }
            .bars span {
                flex: 1;
                border-radius: 2px;
                background: var(--ok);
            }
            .bars .d-null {
                background: var(--empty-bar);
            }
            .bars .d-minor {
                background: var(--warn);
            }
            .bars .d-major {
                background: var(--orange);
            }
            .bars .d-critical {
                background: var(--danger);
            }
            .legend {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-top: 6px;
                color: var(--muted);
                font-size: 12px;
            }
            .legend::before,
            .legend::after {
                content: "";
                order: 1;
                flex: 1;
                height: 1px;
                background: var(--border);
            }
            .legend::after {
                order: 3;
            }
            .legend .uptime {
                order: 2;
            }
            .legend .end {
                order: 4;
            }
            .short {
                display: none;
            }
            @media (max-width: 600px) {
                .bars span:nth-child(-n + 60) {
                    display: none;
                }
                .long {
                    display: none;
                }
                .short {
                    display: inline;
                }
            }
            .day {
                padding: 16px 20px;
                border-bottom: 1px solid var(--border);
            }
            .day:last-child {
                border-bottom: none;
            }
            .day h3 {
                margin: 0;
                font-size: 15px;
                font-weight: 700;
            }
            .day .none {
                margin: 4px 0 0;
                color: var(--muted);
                font-size: 14px;
            }
            .incident {
                padding: 16px 20px;
                border-bottom: 1px solid var(--border);
            }
            .incident:last-child {
                border-bottom: none;
            }
            .day .incident {
                padding: 10px 0 0;
                border: none;
            }
            .incident h4 {
                margin: 0 0 4px;
                font-size: 16px;
                font-weight: 600;
            }
            .i-minor h4 {
                color: var(--warn);
            }
            .i-major h4 {
                color: var(--orange);
            }
            .i-critical h4 {
                color: var(--danger);
            }
            .i-maintenance h4 {
                color: var(--info);
            }
            .meta {
                color: var(--muted);
                font-size: 13px;
            }
            .update {
                margin-top: 10px;
            }
            .update p {
                margin: 2px 0 0;
                white-space: pre-wrap;
            }
            .update strong {
                font-size: 14px;
            }
            .empty {
                padding: 18px 20px;
                color: var(--muted);
            }
            footer {
                color: var(--muted);
                font-size: 13px;
                text-align: center;
            }
            .error {
                color: var(--danger);
            }
        </style>
    </head>
    <body data-instance="__INSTANCE_NAME__">
        <main>
            <header>
                __INSTANCE_ICON__
                <h1>__INSTANCE_NAME__ Status</h1>
                <a id="home" href="/" hidden>Open __INSTANCE_NAME__</a>
            </header>
            <div id="banner" class="banner loading" role="status"><span>Checking status…</span></div>
            <section id="active-section" hidden>
                <h2>Active incidents</h2>
                <div class="box" id="active"></div>
            </section>
            <section id="maintenance-section" hidden>
                <h2>Scheduled maintenance</h2>
                <div class="box" id="maintenance"></div>
            </section>
            <section id="components-section" hidden>
                <p class="caption"><span>Uptime over the past <span class="long">90</span><span class="short">30</span> days</span></p>
                <div class="box" id="components"></div>
            </section>
            <section>
                <h2>Past incidents</h2>
                <div class="box" id="history"><div class="empty">Loading…</div></div>
            </section>
            <footer id="updated"></footer>
        </main>
        <script>
            "use strict";
            const INSTANCE = document.body.dataset.instance;
            const STATE_LABELS = {
                operational: "Operational",
                degraded_performance: "Degraded performance",
                partial_outage: "Partial outage",
                major_outage: "Major outage",
                under_maintenance: "Under maintenance",
                investigating: "Investigating",
                identified: "Identified",
                monitoring: "Monitoring",
                resolved: "Resolved",
                scheduled: "Scheduled",
                in_progress: "In progress",
                verifying: "Verifying",
                completed: "Completed",
            };
            const DAY_LABELS = {
                none: "No downtime recorded",
                minor: "Degraded performance",
                major: "Partial outage",
                critical: "Major outage",
                null: "No data",
            };
            const HISTORY_DAYS = 14;
            let loaded = false;

            const el = (tag, attrs = {}, ...children) => {
                const node = document.createElement(tag);
                for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
                for (const child of children.flat()) if (child != null && child !== false) node.append(child instanceof Node ? child : String(child));
                return node;
            };
            const fmt = (d) => (d ? new Date(d).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "");
            const fmtDay = (d) => new Date(d).toLocaleDateString(undefined, { dateStyle: "medium", timeZone: "UTC" });
            const dayKey = (d) => new Date(d).toISOString().slice(0, 10);

            const incident = (i) => {
                const meta = [];
                if (i.scheduled_for) meta.push(`Scheduled ${fmt(i.scheduled_for)} to ${fmt(i.scheduled_until)}`);
                if (i.components.length) meta.push(`Affects ${i.components.map((c) => c.name).join(", ")}`);
                return el(
                    "article",
                    { class: `incident i-${i.impact}` },
                    el("h4", {}, i.name),
                    meta.length ? el("div", { class: "meta" }, meta.join(" · ")) : null,
                    i.incident_updates.map((u) => el("div", { class: "update" }, el("strong", {}, STATE_LABELS[u.status] ?? u.status), " ", el("span", { class: "meta" }, fmt(u.created_at)), el("p", {}, u.body))),
                );
            };

            const component = (c) =>
                el(
                    "div",
                    { class: "component" },
                    el(
                        "div",
                        { class: "component-head" },
                        el("div", { class: "name" }, c.name, c.description ? el("div", { class: "desc" }, c.description) : null),
                        el("span", { class: `state s-${c.status}` }, STATE_LABELS[c.status] ?? c.status),
                    ),
                    c.uptime_days
                        ? [
                              el(
                                  "div",
                                  { class: "bars", role: "img", "aria-label": `${c.uptime}% uptime over the past 90 days` },
                                  c.uptime_days.map((d) => el("span", { class: `d-${d.indicator}`, title: `${fmtDay(d.date)}: ${DAY_LABELS[d.indicator] ?? d.indicator}` })),
                              ),
                              el(
                                  "div",
                                  { class: "legend", "aria-hidden": "true" },
                                  el("span", {}, el("span", { class: "long" }, "90 days ago"), el("span", { class: "short" }, "30 days ago")),
                                  el("span", { class: "uptime" }, `${c.uptime} % uptime`),
                                  el("span", { class: "end" }, "Today"),
                              ),
                          ]
                        : null,
                );

            const history = (incidents) => {
                const byDay = Map.groupBy(incidents, (i) => dayKey(i.created_at));
                const today = Date.UTC(new Date().getUTCFullYear(), new Date().getUTCMonth(), new Date().getUTCDate());
                return Array.from({ length: HISTORY_DAYS }, (_, n) => {
                    const key = dayKey(today - n * 86400000);
                    const items = byDay.get(key) ?? [];
                    return el("div", { class: "day" }, el("h3", {}, fmtDay(key)), items.length ? items.map(incident) : el("p", { class: "none" }, "No incidents reported."));
                });
            };

            const fill = (id, nodes) => document.getElementById(id).replaceChildren(...nodes);

            async function load() {
                const banner = document.getElementById("banner");
                try {
                    const res = await fetch("/api/v9/status/summary.json", { cache: "no-store" });
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const s = await res.json();

                    const home = document.getElementById("home");
                    if (s.page.url && /^https?:\/\//.test(s.page.url)) home.href = s.page.url;
                    home.hidden = false;

                    banner.className = `banner ${s.status.indicator}`;
                    banner.replaceChildren(el("span", {}, s.status.description));

                    document.getElementById("active-section").hidden = !s.incidents.length;
                    fill("active", s.incidents.map(incident));
                    document.getElementById("maintenance-section").hidden = !s.scheduled_maintenances.length;
                    fill("maintenance", s.scheduled_maintenances.map(incident));
                    document.getElementById("components-section").hidden = !s.components.length;
                    fill("components", s.components.map(component));
                    fill("history", history(s.history));
                    document.getElementById("updated").textContent = `Last checked ${fmt(new Date())}`;
                    loaded = true;
                    setTimeout(load, 60000);
                } catch (e) {
                    banner.className = "banner unreachable";
                    banner.replaceChildren(el("span", {}, `Can't reach ${INSTANCE} right now`));
                    if (!loaded) fill("history", [el("div", { class: "empty" }, "Incident history shows up once the server responds again.")]);
                    document.getElementById("updated").replaceChildren(el("span", { class: "error" }, `Couldn't load the current status (${e.message}). Retrying every 30 seconds…`));
                    setTimeout(load, 30000);
                }
            }

            load();
        </script>
    </body>
</html>
